# From upstream ecotaxa_front/docker/all_in_one/nginx.conf ("NOT PRODUCTION READY" there; here it
# only ever sits behind the host Caddy, which terminates TLS and logs). Hostnames ecotaxaback /
# ecotaxafront are the compose service names on the `econet` network.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stdout info;

events {
    worker_connections  128;
}

http {
    types_hash_max_size 2048;
    client_max_body_size 2G;
    client_body_timeout 600;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80 default_server;

        # images (thumbnails) written by the back-end, read-only here
        location /vault/  {
               alias /vault/;
        }

        # /api straight to the back-end (FastAPI)
        location /api/  {
               proxy_pass http://ecotaxaback:8000;
               proxy_read_timeout 600;
        }

        # everything else: the Flask front-end over uwsgi
        location / {
                include uwsgi_params;
                uwsgi_pass ecotaxafront:3030;
                uwsgi_read_timeout 600;
                uwsgi_send_timeout 600;
                proxy_buffering off;
                uwsgi_buffering off;
        }
    }
}
