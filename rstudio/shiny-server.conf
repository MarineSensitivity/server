# Shiny Server config for the `rstudio` container (bind-mounted over the rocker
# default at /etc/shiny-server/shiny-server.conf; a change here needs
# `docker compose restart rstudio` -- same single-file-bind-mount inode rule as
# the Caddyfile).
#
# TWO server blocks, ONE app codebase.
#
#   :3838  the public instance -- /srv/shiny-server = host /share/shiny_apps, where
#          scores/ and species/ are symlinks into the apps_v8 checkout. Caddy's
#          app.marinesensitivity.org (and shiny.*) vhosts proxy here.
#
#   :3839  the PREVIEW instance -- /srv/shiny-server-preview = this repo's
#          rstudio/shiny_apps_preview/, whose {scores,species}/app.R are 3-line
#          WRAPPERS: `Sys.setenv(MS_PREVIEW = "1"); shiny::shinyAppDir(<the real
#          app>)`. Same code, a second R process, one env var. Only Caddy's
#          signed-in preview.marinesensitivity.org vhost proxies here (on the
#          compose network; the port is not published).
#
# Why a second process rather than a trusted header: this server opens its OWN
# websocket to the R worker (lib/proxy/sockjs.js createWebSocketClient), so no
# client or proxy header reaches session$request, and a client-supplied
# url_search could otherwise steer the public instance to a restricted release.
# The app resolves ?ver= through msens::atlas_allow_access(), which reads
# MS_PREVIEW: the public process has no code path that renders a restricted
# (under-review) release. See
# workflows/.claude/plans/2026-08-15 pre-release review gate — preview host + Cloudflare Access.md

# Instruct Shiny Server to run applications as the user "shiny"
run_as shiny;

# KEEP WORKERS WARM. shiny-server terminates an app's R process 5 SECONDS after
# its last session disconnects (`app_idle_timeout` default), so the next visitor
# pays the whole cold start: measured here as ~15 s of time-to-first-byte, with
# the entire client side (79 requests, 148 KB) a rounding error beside it. An
# hour keeps a review session — and the colleague who opens the link ten minutes
# later — at the warm ~1.4 s, while still releasing the memory (~550 MB per app
# process that has served a version) overnight. Set 0 to keep them forever.
# 1800, not 3600: every DEPLOY_APPS starts fresh workers and the OLD ones linger
# until they idle out, so the window is also how long a deploy's orphans hold
# their ~550 MB. The `warm` sidecar runs every 20 min, comfortably inside this.
app_idle_timeout 1800;


# the public instance
server {
  listen 3838;

  location / {
    site_dir /srv/shiny-server;
    log_dir /var/log/shiny-server;
    directory_index on;
  }
}

# the preview instance (restricted releases; reachable only via the signed-in vhost)
server {
  listen 3839;

  location / {
    site_dir /srv/shiny-server-preview;
    # same log_dir: filenames carry the worker port, so the two instances stay apart
    log_dir /var/log/shiny-server;
    directory_index off;
  }
}
